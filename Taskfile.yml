# Developer entry points (plan/05 §6). Run inside WSL Ubuntu: `task <name>`; `task --list` shows them all.
# Every task calls the same scripts CI uses, so a green local run predicts a green CI run.
version: "3"

tasks:
  tools:
    desc: Install the pinned CLI tools into ~/.local/bin (checksum-verified)
    cmds: [bash hack/install-tools.sh]

  vendor:
    desc: Fetch/verify pinned upstream manifests, image digests and source clones
    cmds: [bash hack/vendor.sh]

  hooks:
    desc: Install the git pre-commit secret scan for this clone
    cmds: [ln -sf ../../hack/pre-commit.sh .git/hooks/pre-commit]

  lint:
    desc: All linters (Go, Rust, web, shell, manifests, secrets)
    cmds:
      - golangci-lint run ./...
      - cd gateway && cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings
      - pnpm run lint && pnpm run typecheck
      - shellcheck hack/*.sh
      - bash hack/check-secrets.sh
      - bash hack/check-manifests.sh
      - actionlint

  test:
    desc: Unit tests (Go with the race detector, Rust with nextest); admin-DB tests skip without the local stack
    cmds:
      - go test -race -count=1 ./...
      - cd gateway && cargo nextest run --locked

  gen:
    desc: Regenerate sqlc queries and the OpenAPI Go types (never edit the output by hand)
    cmds:
      - cd db && sqlc generate
      - oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
      - bash hack/gen-river-migration.sh

  db:up:
    desc: Start the local Supabase stack and migrate the admin DB (dev only)
    cmds:
      - supabase start
      - bash hack/admin-db.sh migrate up
      - bash hack/admin-db.sh roles

  db:test:
    desc: Admin-DB tests against the local Supabase stack (throwaway databases; dev data untouched)
    env:
      ADMIN_DB_TEST_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
    cmds:
      - go test -race -count=1 ./db/... ./internal/store/...

  api:lint:
    desc: Lint the OpenAPI contract (errors fail) and run the contract tests
    cmds:
      - go run github.com/daveshanley/vacuum@v0.30.6 lint -r api/vacuum-ruleset.yaml -n error api/openapi.yaml
      - go test -count=1 ./api/

  build:
    desc: Build Go binaries, the gateway and the static web exports
    cmds:
      - go build -trimpath -o bin/ ./cmd/...
      - cd gateway && cargo build --release --locked
      - pnpm run build

  images:
    desc: Build the local container images (amd64)
    cmds:
      - docker buildx build --load -f build/go.Dockerfile --build-arg BINARY=control-api -t dbcloud/control-api:dev .
      - docker buildx build --load -t dbcloud/pg-gateway:dev gateway

  cell:up:
    desc: "Start the local cell under Flux (PROFILE=starter: 1 server, default; PROFILE=reference: 3 servers + 1 agent)"
    cmds: ['bash hack/cell.sh up {{.PROFILE | default "starter"}}']

  cell:sync:
    desc: Roll out changes under deploy/ to the running cell through Flux
    cmds: [bash hack/cell-flux.sh]

  cell:down:
    desc: Delete the local cell and its LVM loop files
    cmds: [bash hack/cell.sh down]

  cell:status:
    desc: Show nodes, Flux layers and Postgres clusters of the local cell
    cmds: [bash hack/cell.sh status]

  cell:test:
    desc: Step 0.3 acceptance tests against the running cell (PSA, audit, isolation, TopoLVM, PITR, WireGuard)
    cmds: [go test -tags cell -count=1 -v -timeout 40m ./test/cell/]
