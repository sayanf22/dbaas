# API server admission configuration (plan/01 §6.3), at /var/lib/rancher/k3s/server/psa.yaml on every server.
# PodSecurity: every namespace is `restricted` unless listed as an exemption below; each exemption exists
# for pods that must touch the host and is also guarded by ValidatingAdmissionPolicies (Step 1.3).
# EventRateLimit: the example limits from the Kubernetes admission-controller docs.
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: restricted
        enforce-version: latest
        audit: restricted
        audit-version: latest
        warn: restricted
        warn-version: latest
      exemptions:
        usernames: []
        runtimeClasses: []
        namespaces:
          - kube-system       # K3s components (CoreDNS, metrics-server, Spegel)
          - topolvm-system    # TopoLVM node plugin: privileged, mounts block devices
          - dbcloud-edge      # pg-gateway DaemonSet: hostPort 5432
          - observability     # node-exporter, Fluent Bit: host paths and host network
  - name: EventRateLimit
    configuration:
      apiVersion: eventratelimit.admission.k8s.io/v1alpha1
      kind: Configuration
      limits:
        - type: Namespace
          qps: 50
          burst: 100
          cacheSize: 2000
        - type: User
          qps: 10
          burst: 50
