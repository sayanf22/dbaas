# Local cell, HA shape (later): three K3s servers on embedded etcd plus one agent.
#   server-0..2 = ctl-1..3  K3s servers (etcd members) + platform workloads; label dbcloud.io/pool=control
#   agent-0     = node-1    K3s agent: tenant databases and per-node DaemonSets only; label
#                           dbcloud.io/pool=tenant, taint dbcloud.io/pool=tenant:NoSchedule
# Same labels, taint and manifests as the starter shape (k3d-starter.yaml); more tenant nodes join as agents.
# The k3d load balancer gives kubectl one address for the three API servers (used to test that the API
# survives the loss of a server). hack/cell.sh sets REPO, LOCAL_STATE and K3S_IMAGE.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: local
servers: 3
agents: 1
image: ${K3S_IMAGE}
registries:
  use: [k3d-dbcloud-registry:5000]
volumes:
  - volume: ${REPO}/deploy/k3s/server.yaml:/etc/rancher/k3s/config.yaml.d/10-dbcloud-server.yaml
    nodeFilters: [server:*]
  - volume: ${REPO}/deploy/local/k3s/90-local-server.yaml:/etc/rancher/k3s/config.yaml.d/90-local.yaml
    nodeFilters: [server:*]
  - volume: ${REPO}/deploy/k3s/psa.yaml:/var/lib/rancher/k3s/server/psa.yaml
    nodeFilters: [server:*]
  - volume: ${REPO}/deploy/k3s/audit.yaml:/var/lib/rancher/k3s/server/audit.yaml
    nodeFilters: [server:*]
  - volume: ${REPO}/deploy/k3s/agent.yaml:/etc/rancher/k3s/config.yaml.d/10-dbcloud-agent.yaml
    nodeFilters: [agent:*]
  - volume: ${REPO}/deploy/local/k3s/90-local-agent.yaml:/etc/rancher/k3s/config.yaml.d/90-local.yaml
    nodeFilters: [agent:*]
  # TopoLVM on every node (tenant volumes on the agent, platform PVCs on the servers), one lvmd socket each.
  - volume: /dev:/dev
    nodeFilters: [server:*, agent:*]
  - volume: ${LOCAL_STATE}/run/k3d-local-server-0:/run/topolvm
    nodeFilters: [server:0]
  - volume: ${LOCAL_STATE}/run/k3d-local-server-1:/run/topolvm
    nodeFilters: [server:1]
  - volume: ${LOCAL_STATE}/run/k3d-local-server-2:/run/topolvm
    nodeFilters: [server:2]
  - volume: ${LOCAL_STATE}/run/k3d-local-agent-0:/run/topolvm
    nodeFilters: [agent:0]
options:
  k3d:
    wait: true
    timeout: 420s
  k3s:
    extraArgs:
      - arg: --cluster-init
        nodeFilters: [server:0]
      - arg: --node-taint=dbcloud.io/pool=tenant:NoSchedule   # tenant node: tenants + DaemonSets only
        nodeFilters: [agent:*]
    nodeLabels:
      - label: dbcloud.io/pool=control
        nodeFilters: [server:*]
      - label: dbcloud.io/pool=tenant
        nodeFilters: [agent:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
