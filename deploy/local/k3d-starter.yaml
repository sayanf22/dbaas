# Local cell, starter shape (ADR-025): one K3s server with embedded etcd (`cluster-init`), which is also the
# tenant node, like the single starter VM. Created by hack/cell.sh, which sets REPO, LOCAL_STATE and
# K3S_IMAGE (digest from deploy/vendor/images.lock); k3d expands ${VAR} before parsing this file.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: local
servers: 1
agents: 0
image: ${K3S_IMAGE}
registries:
  use: [k3d-dbcloud-registry:5000]      # local OCI registry for Flux artifacts (hack/cell.sh creates it)
volumes:
  # The production K3s configuration (deploy/k3s), then the local-only overrides.
  - volume: ${REPO}/deploy/k3s/server.yaml:/etc/rancher/k3s/config.yaml.d/10-dbcloud-server.yaml
    nodeFilters: [server:*]
  - volume: ${REPO}/deploy/local/k3s/90-local-server.yaml:/etc/rancher/k3s/config.yaml.d/90-local.yaml
    nodeFilters: [server:*]
  - volume: ${REPO}/deploy/k3s/psa.yaml:/var/lib/rancher/k3s/server/psa.yaml
    nodeFilters: [server:*]
  - volume: ${REPO}/deploy/k3s/audit.yaml:/var/lib/rancher/k3s/server/audit.yaml
    nodeFilters: [server:*]
  # TopoLVM on the tenant node: host block devices and the node's lvmd socket (hack/local-host.sh).
  - volume: /dev:/dev
    nodeFilters: [server:0]
  - volume: ${LOCAL_STATE}/run/k3d-local-server-0:/run/topolvm
    nodeFilters: [server:0]
options:
  k3d:
    wait: true
    timeout: 300s
    disableLoadbalancer: true           # one server; production has no load balancer either
  k3s:
    extraArgs:
      - arg: --cluster-init             # start on embedded etcd so servers can join later (Step 1.13)
        nodeFilters: [server:0]
    nodeLabels:
      - label: dbcloud.io/pool=tenant
        nodeFilters: [server:0]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
