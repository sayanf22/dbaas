[package]
name = "pg-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"                 # MSRV = pinned stable toolchain (30-rust.md)
license = "LicenseRef-Proprietary"
publish = false
description = "Postgres TLS/SNI router on the dbcloud data path (plan/01 §8.2)"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[lints.rust]
unsafe_code = "forbid"
# 10-engineering-standards.md §2: every item is documented. rustc's missing_docs only sees items
# reachable from outside the crate, which a binary has none of, so clippy's private-items lint below
# does the real work; both stay on in case the crate grows a library target.
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Cargo profiles reference: https://doc.rust-lang.org/cargo/reference/profiles.html
# panic stays at the default "unwind" on purpose: a panic in one connection task must be caught by
# tokio and logged, not abort the process and drop every tenant's connections (30-rust.md).
[profile.release]
overflow-checks = true                # an arithmetic bug fails loudly instead of wrapping
lto = "thin"                          # cross-crate inlining at a fraction of fat LTO's build time
codegen-units = 1                     # better optimisation of the hot relay path; slower builds are fine in CI
strip = "symbols"                     # smaller image; removes the symbol table, not cargo-auditable's .dep-v0 section
