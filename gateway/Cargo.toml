[package]
name = "pg-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"                 # MSRV = pinned stable toolchain (30-rust.md)
license = "LicenseRef-Proprietary"
publish = false
description = "Postgres TLS/SNI router on the dbcloud data path (plan/01 §8.2)"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
overflow-checks = true                # an arithmetic bug fails loudly instead of wrapping
lto = "thin"
codegen-units = 1
strip = "symbols"
