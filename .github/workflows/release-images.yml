# Builds release images on every push to main (.kiro/steering/70-ci.md, 55-containers.md):
# native amd64 + arm64 builds (no QEMU) pushed to ghcr.io by digest, merged into one manifest list,
# SBOM (syft) attached, and signed keyless with cosign through GitHub OIDC. Never runs on pull requests.
# Writing the new digests back to the Flux manifests happens by pull request once deploy/flux exists (Step 0.3).
name: release-images

on:
  push:
    branches: [main]
    paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum', 'build/go.Dockerfile', 'gateway/**', '.github/workflows/release-images.yml']

permissions:
  contents: read

concurrency:
  group: release-images
  cancel-in-progress: false         # never cancel a half-pushed release

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write               # push to ghcr.io; only this job has it
    strategy:
      fail-fast: true
      matrix:
        image:
          - {name: control-api, file: build/go.Dockerfile, context: ., args: "BINARY=control-api"}
          - {name: worker, file: build/go.Dockerfile, context: ., args: "BINARY=worker"}
          - {name: cluster-agent, file: build/go.Dockerfile, context: ., args: "BINARY=cluster-agent"}
          - {name: tenant-operator, file: build/go.Dockerfile, context: ., args: "BINARY=tenant-operator"}
          - {name: mcp-server, file: build/go.Dockerfile, context: ., args: "BINARY=mcp-server"}
          - {name: mcp-auth, file: build/go.Dockerfile, context: ., args: "BINARY=mcp-auth"}
          - {name: pg-gateway, file: gateway/Dockerfile, context: gateway, args: ""}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: image name (ghcr.io requires lower case)
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image.name }}
        run: echo "ref=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push by digest (this runner's architecture only)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: |
            ${{ matrix.image.args }}
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ steps.name.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
      - name: record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image.name }}
          ARCH: ${{ runner.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${IMAGE}-${ARCH}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image.name }}-${{ runner.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write               # push the manifest list and signatures
      id-token: write               # cosign keyless signing through GitHub OIDC
    strategy:
      matrix:
        name: [control-api, worker, cluster-agent, tenant-operator, mcp-server, mcp-auth, pg-gateway]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.name }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: merge into one multi-arch manifest, tagged with the commit SHA
        id: merge
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.name }}
          SHA: ${{ github.sha }}
        run: |
          ref="ghcr.io/${OWNER,,}/${IMAGE}"
          # Artifacts from the build job are treated as untrusted input: accept only sha256 digests.
          sources=()
          for f in digests/*; do
            d="$(cat "$f")"
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest in $f" >&2; exit 1; }
            sources+=("${ref}@${d}")
          done
          [[ ${#sources[@]} -eq 2 ]] || { echo "want 2 architectures, got ${#sources[@]}" >&2; exit 1; }
          docker buildx imagetools create -t "${ref}:${SHA}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${ref}:${SHA}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.merge.outputs.ref }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: sign the digest and attest the SBOM (keyless)
        env:
          REF: ${{ steps.merge.outputs.ref }}@${{ steps.merge.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
